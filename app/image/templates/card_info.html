<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Card - {{ title }}</title>
    <style>
        @font-face { font-family: 'Komika Axis'; src: url('{{ font_url }}') format('truetype'); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1080px; height: 1920px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #070707; display:flex; align-items:center; justify-content:center; overflow:hidden; }

        .bg-container {
            position: absolute; inset: 0; background: radial-gradient(circle at 20% 30%, rgba(255,175,0,0.08) 0%, transparent 25%), radial-gradient(circle at 80% 70%, rgba(255,90,0,0.06) 0%, transparent 30%), linear-gradient(180deg,#030303 0%, #0b0b0b 100%);
        }

        .container { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:90px; }

        .card {
            width:100%; height:100%; border-radius:45px; background: linear-gradient(180deg, rgba(20,20,20,0.9), rgba(12,12,12,0.95)); border: 1px solid rgba(255,175,0,0.06); padding: 90px; display:flex; flex-direction:column; box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(255,175,0,0.06);
            position:relative; overflow:hidden;
        }

        .card::before { content:''; position:absolute; top:-20%; left:-20%; width:140%; height:60%; background: radial-gradient(circle, rgba(255,175,0,0.06), transparent 40%); transform: rotate(-15deg); }

        .highlight { position:absolute; top:0; left:0; right:0; height:260px; background: linear-gradient(180deg, rgba(255,200,80,0.06), transparent 60%); border-radius:45px 45px 0 0; pointer-events:none; }

        .header { text-align:center; margin-bottom:60px; z-index:2; }
        .brand { font-family: 'Komika Axis', sans-serif; font-size:86px; font-weight:800; color:#ffc857; text-shadow: 0 6px 18px rgba(0,0,0,0.7), 0 0 18px rgba(255,175,0,0.08); }
        .badge { display:inline-block; margin-top:18px; padding:10px 26px; border-radius:26px; background: rgba(255,175,0,0.06); color:#ffd89b; border:1px solid rgba(255,175,0,0.12); font-weight:700; font-size:22px; }

        .body { flex:1; display:flex; align-items:center; justify-content:center; z-index:2; }
        .message { font-size:58px; line-height:1.55; color:#fff; text-align:center; max-width:82%; white-space:pre-wrap; word-wrap:break-word; font-weight:500; text-shadow: 0 4px 14px rgba(0,0,0,0.7); }

        .footer { text-align:center; margin-top:auto; padding-top:40px; z-index:2; }
        .footer-text { font-size:28px; color: rgba(255,255,255,0.6); margin-bottom:14px; }
        .cta { display:inline-block; padding:12px 26px; border-radius:22px; background: linear-gradient(135deg,#ffb03b,#ff8a3d); color:#2b1b00; font-weight:700; box-shadow: 0 6px 18px rgba(255,140,60,0.12); }

        @media (max-width:768px){ .container{padding:40px} .brand{font-size:64px} .message{font-size:40px} }
    </style>
</head>
<body>
    <div class="bg-container"></div>
    <div class="container">
        <div class="card">
            <div class="highlight"></div>
            <div class="header">
                <div class="brand">INFO</div>
                <div class="badge">info#{{ id }}</div>
            </div>
            <div class="body">
                <div class="message">{{ message }}</div>
            </div>
            <div class="footer">
                <div class="footer-text">@spottedatbz</div>
                <div class="cta">📢 Info Importante</div>
            </div>
        </div>
    </div>
</body>
</html>
