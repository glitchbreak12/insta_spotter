<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 900px;
            height: 1600px;
            background: #ffffff;
            border: 4px solid #6366f1;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 20px;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            color: #6366f1;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 24px;
            color: #6b7280;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .message {
            font-size: 36px;
            line-height: 1.4;
            color: #374151;
            font-weight: normal;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
        }

        .footer {
            text-align: center;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }

        .footer-text {
            font-size: 24px;
            color: #9ca3af;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="title">{{ title|default("INFO") }}</div>
            <div class="subtitle">Importante</div>
        </div>

        <div class="content">
            <p class="message">{{ message }}</p>
        </div>

        <div class="footer">
            <div class="footer-text">@spottedatbz</div>
        </div>
    </div>
</body>
</html>
