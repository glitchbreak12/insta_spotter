<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Card - {{ title }}</title>
    <style>
        @font-face {
            font-family: 'Komika Axis';
            src: url('{{ font_url }}') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background: #000000;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sfondo spaziale professionale - tema info con accenti blu */
        .bg-container {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 30% 40%, rgba(0, 122, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(88, 86, 214, 0.12) 0%, transparent 50%),
                linear-gradient(180deg, #000000 0%, #0a0a0a 50%, #000000 100%);
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 90px;
        }

        /* Card con Glow 3D avanzato */
        .card {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 20, 0.85);
            border-radius: 45px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 0 15px rgba(0, 122, 255, 0.4),
                0 0 45px rgba(0, 122, 255, 0.25),
                0 0 90px rgba(0, 122, 255, 0.15),
                0 25px 70px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(60px) saturate(200%);
            -webkit-backdrop-filter: blur(60px) saturate(200%);
            display: flex;
            flex-direction: column;
            padding: 100px 90px;
            overflow: hidden;
        }

        /* Glow sottile avanzato */
        .card::before {
            content: '';
            position: absolute;
            top: -35%;
            left: -35%;
            width: 170%;
            height: 170%;
            background: radial-gradient(circle, rgba(0, 122, 255, 0.1) 0%, transparent 75%);
            opacity: 0.6;
            pointer-events: none;
        }

        /* Highlight superiore migliorato */
        .highlight {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 380px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, transparent 100%);
            border-radius: 45px 45px 0 0;
            pointer-events: none;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 90px;
            position: relative;
            z-index: 2;
            padding-top: 60px;
        }

        .brand {
            font-family: 'Komika Axis', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 110px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 6px;
            margin-bottom: 45px;
            text-shadow:
                0 0 15px rgba(0, 122, 255, 0.6),
                0 0 25px rgba(0, 122, 255, 0.4),
                0 0 35px rgba(0, 122, 255, 0.2),
                0 3px 8px rgba(0, 0, 0, 0.9);
            line-height: 1.1;
        }

        /* Badge con tema info migliorato */
        .badge {
            display: inline-block;
            padding: 15px 35px;
            background: rgba(0, 122, 255, 0.15);
            border: 1px solid rgba(0, 122, 255, 0.3);
            border-radius: 30px;
            color: #5ac8fa;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: 2px;
            box-shadow: 0 6px 25px rgba(0, 122, 255, 0.2);
            backdrop-filter: blur(20px);
        }

        /* Body */
        .body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            position: relative;
            z-index: 2;
            min-height: 0;
            margin: 0;
        }

        /* Titolo info migliorato */
        .info-title {
            font-family: 'Komika Axis', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 78px;
            font-weight: 700;
            color: #5ac8fa;
            text-align: center;
            margin-bottom: 50px;
            text-shadow:
                0 0 12px rgba(0, 122, 255, 0.6),
                0 0 22px rgba(0, 122, 255, 0.4),
                0 3px 8px rgba(0, 0, 0, 0.9);
            line-height: 1.2;
            max-width: 90%;
            letter-spacing: 1px;
        }

        .message {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 68px;
            line-height: 1.6;
            text-align: center;
            color: #ffffff;
            font-weight: 400;
            max-width: 85%;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 18px rgba(0, 0, 0, 0.7),
                0 6px 12px rgba(0, 0, 0, 0.9);
            margin: 0;
            padding: 0;
            letter-spacing: 0.5px;
        }

        /* Enhanced formatting for INFO content */
        .message strong {
            color: #5ac8fa;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(0, 122, 255, 0.6);
        }

        .message em {
            color: #88d4ff;
            font-style: italic;
            text-shadow: 0 0 10px rgba(88, 214, 255, 0.5);
        }

        .message p {
            margin-bottom: 25px;
        }

        .message ul, .message ol {
            text-align: left;
            margin: 35px auto;
            max-width: 85%;
        }

        .message li {
            margin-bottom: 25px;
            position: relative;
            padding-left: 55px;
        }

        .message li::before {
            content: "📢";
            position: absolute;
            left: 0;
            top: 0;
            color: #5ac8fa;
            font-size: 36px;
            filter: drop-shadow(0 0 10px rgba(0, 122, 255, 0.6));
        }

        /* Footer migliorato */
        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 70px;
            padding-bottom: 50px;
            position: relative;
            z-index: 2;
        }

        .footer-text {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .cta {
            display: inline-block;
            padding: 14px 32px;
            background: rgba(0, 122, 255, 0.2);
            border: 1px solid rgba(0, 122, 255, 0.4);
            border-radius: 25px;
            color: #5ac8fa;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.25);
            backdrop-filter: blur(15px);
        }

        /* Publish date migliorata */
        .publish-date {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 18px;
            letter-spacing: 0.8px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="bg-container"></div>

    <div class="container">
        <div class="card">
            <div class="highlight"></div>

            <div class="header">
                <div class="brand">INFO</div>
                <div class="badge">info#{{ id }}</div>
            </div>

            <div class="body">
                {% if title and title != "Titolo Card" %}
                <div class="info-title">{{ title }}</div>
                {% endif %}
                <div class="message">{{ message }}</div>
            </div>

            <div class="footer">
                <div class="footer-text">@spottedatbz</div>
                <div class="cta">📢 Info Importante</div>
                <div class="publish-date">{{ publish_date or "Oggi" }}</div>
            </div>
        </div>
    </div>
</body>
</html>
